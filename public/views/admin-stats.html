    <script>
      function showBanModal(action, userId, name) {
        const isBan = action === 'ban';
        document.getElementById('ban-modal-title').textContent = (isBan ? 'Ban ' : 'Unban ') + name + '?';
        document.getElementById('ban-modal-text').textContent = isBan
          ? name + ' will no longer be able to log in.'
          : name + ' will be able to log in again.';
        const submit = document.getElementById('ban-modal-submit');
        submit.textContent = isBan ? 'Ban' : 'Unban';
        submit.className = 'px-4 py-2 text-xs font-bold uppercase tracking-widest rounded transition-colors focus-visible:outline-none ' +
          (isBan
            ? 'bg-red-500/10 text-red-400 border border-red-500/30 hover:bg-red-500/20'
            : 'bg-brand-green/10 text-brand-green border border-brand-green/30 hover:bg-brand-green/20');
        document.getElementById('ban-modal-form').action = '/admin/users/' + userId + '/' + action;
        document.getElementById('ban-modal').classList.remove('hidden');
      }
      function closeBanModal() {
        document.getElementById('ban-modal').classList.add('hidden');
      }
      document.getElementById('ban-modal').addEventListener('click', function(e) {
        if (e.target === this) closeBanModal();
      });
    </script>
